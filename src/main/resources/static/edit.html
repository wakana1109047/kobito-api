<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>こびと編集ページ</title>

    <style>
        body {
            font-family: "Hiragino Maru Gothic ProN", sans-serif;
            margin: 20px;
            background: #fff7e6;
            color: #4a3b2a;
        }

        .container {
            background: #fff3d4;
            padding: 20px;
            border-radius: 12px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid #d4a373;
            border-radius: 6px;
            background: #fffdf7;
        }

        button {
            background: #f4c27a;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #5a3e1b;
            margin-top: 10px;
        }

        button:hover {
            background: #e8b568;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>こびとを編集する</h1>

    <input type="text" id="name" placeholder="名前">
    <textarea id="description" placeholder="特徴"></textarea>
    <input type="text" id="imageUrl" placeholder="画像URL">
    <img id="preview" src="" width="200" style="margin-top:10px; border-radius:8px;">


    <button type="button" onclick="updateKobito()">更新する</button>
    <button onclick="window.location.href='index.html'">一覧に戻る</button>
</div>

<script>
    const API_BASE_URL = "http://localhost:8080/api/kobito";

    // URL の ?id=3 を取得
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    // 編集対象のデータを読み込む
    async function loadKobito() {
        const res = await fetch(`${API_BASE_URL}/${id}`);
        const data = await res.json();

        document.getElementById("name").value = data.name;
        document.getElementById("description").value = data.description;
        document.getElementById("imageUrl").value = data.imageUrl || "";
        document.getElementById("preview").src = data.imageUrl || "";

        document.getElementById("imageUrl").addEventListener("input", (e) => {
            document.getElementById("preview").src = e.target.value;
        });

    }

    loadKobito();

    // PUT 更新処理
    async function updateKobito() {
        const updated = {
            id: id,
            name: document.getElementById("name").value,
            description: document.getElementById("description").value,
            imageUrl: document.getElementById("imageUrl").value
        };

        try {
            const response = await fetch(`${API_BASE_URL}/${id}`, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(updated)
            });

            if (!response.ok) {
                throw new Error("更新に失敗しました");
            }

            alert("更新しました！");
            setTimeout(() => goBack(), 10);
            // goBack();

        } catch (error) {
            alert("更新エラー: " + error.message);
        }
    }


</script>

</body>
</html>
